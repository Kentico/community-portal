name: "CI: Build and Test"

on:
  pull_request:
    branches: [main]
    paths:
      - "**.cs"
      - "**.csproj"
      - "**.props"
      - "**.targets"
      - "**.sln"
      - "**.ps1"
      - "**.sql"
      - "**.config"
      - "**.yml"
      - "**.json"
      - "**.css"
      - "**.scss"
      - "**.ts"
      - "**.tsx"
      - "**.js"
      - "**.razor"
      - "**.cshtml"

# Cancel in-progress runs when a new commit is pushed
concurrency:
  group:
    ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build_and_test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 30 # Fail if workflow takes longer than expected
    defaults:
      run:
        shell: pwsh

    env:
      ASPNETCORE_ENVIRONMENT: CI
      DATABASE_BACKUP_FILENAME: ""
      DOTNET_CLI_TELEMETRY_OPTOUT: 1
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 1
      DOTNET_NOLOGO: 1
      NO_COLOR: 1
      DOTNET_SYSTEM_CONSOLE_ALLOW_ANSI_COLOR_REDIRECTION: false
      PROJECT_NAME: Kentico.Community.Portal.Web
      # 45041 (plain HTTP) matches the launch profile.
      ASPNETCORE_URLS: https://localhost:45039;https://localhost:45040;http://localhost:45041
      SQL_SA_PASSWORD: Pass@12345

    steps:
      # === Environment Setup ===
      - name: Checkout
        uses: actions/checkout@v6

      # The SQL container + DB restore + Release build + publish leave the runner
      # with < 2 GB free by the E2E stage, causing ENOSPC on the Playwright browser
      # download. Reclaim ~7 GB up front by removing two large, quick-to-delete
      # preinstalled toolchains this build never uses. CodeQL and Swift are chosen
      # over Android/GHC because they hold far fewer files and so delete in seconds.
      - name: Free up runner disk space
        shell: bash
        run: |
          echo "Disk before cleanup:"; df -h /
          sudo rm -rf /opt/hostedtoolcache/CodeQL /usr/share/swift
          echo "Disk after cleanup:"; df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: "package.json"

      - name: Setup pnpm and install packages
        uses: pnpm/setup@v3
        with:
          cache: true

      - name: Install Playwright browsers
        working-directory: ./test/kentico-community-portal-web-e2e-tests
        run: |
          # Headless CI: install only the smaller chromium-headless-shell. Every project uses
          # Chromium; without the browser name Playwright also downloads Firefox and WebKit
          # (~8s). FFmpeg (video on failure) comes with chromium.
          # --with-deps is intentionally omitted — the required system libraries
          # are already present on GitHub's ubuntu-latest runners, and the apt
          # step it runs adds ~45s. https://playwright.dev/docs/browsers
          Write-Output "Installing Playwright headless shell..."
          pnpm exec playwright install --only-shell chromium
          Write-Output "✓ Playwright headless shell installed"

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/packages.lock.json') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      # === Build ===
      - name: Restore NuGet packages
        run: dotnet restore --locked-mode

      - name: Build solution
        run: |
          dotnet build `
            -c Release `
            --no-restore

      # === Database Setup ===
      - name: Get Database Backup Name
        run: |
          $latestBackup = Get-ChildItem -Path "./database" -Filter "*.zip" | Select-Object -ExpandProperty BaseName
          "DATABASE_BACKUP_FILENAME=$latestBackup" >> $env:GITHUB_ENV

      - name: Extract Database Backup
        run: |
          Expand-Archive `
            -Path "./database/${{ env.DATABASE_BACKUP_FILENAME }}.zip" `
            -DestinationPath "./database"

      - name: Install SQL Server (2022)
        uses: potatoqualitee/mssqlsuite@bc850f242e5fe551e36cea6fa4bed608c58fa489 # v2
        with:
          # sqlpackage is intentionally absent: nothing in this workflow uses it. Its only
          # consumer is scripts/Restore-SaaS-Backup.ps1, a local developer script that
          # installs its own copy via `dotnet tool install -g microsoft.sqlpackage`.
          install: sqlengine, sqlclient
          sa-password: ${{ env.SQL_SA_PASSWORD }}
          version: 2022

      - name: Restore Database from Backup
        working-directory: "./scripts"
        run: |
          ./Restore-Database-Backup.ps1 `
            -BackupFileName "${{ env.DATABASE_BACKUP_FILENAME }}" `
            -SaPassword "${{ env.SQL_SA_PASSWORD }}"

          "## ✓ Database Restored" >> $env:GITHUB_STEP_SUMMARY

      - name: Restore License Key
        working-directory: "./scripts"
        run: |
          ./Restore-LicenseKey.ps1 -LicenseKey ${{ secrets.XPERIENCE_LICENSE_KEY }}

      - name: Restore CI Repository
        working-directory: "./scripts"
        run: |
          ./Restore-CI.ps1
          "## ✓ CI Repository Restored" >> $env:GITHUB_STEP_SUMMARY

      # Macros in the CI repository are signed with the Production salt (developers use it locally),
      # but CI runs with its own CMSHashStringSalt. Without re-signing, signed macros (email
      # templates, contact group rules) fail their security check and render empty.
      # --sign-all is safe here: the database only exists for this run.
      - name: Re-sign macros for the CI hash salt
        working-directory: "./src/Kentico.Community.Portal.Web"
        run: |
          dotnet run --launch-profile Portal.WebCI -c Release --no-build --no-restore -- --kxp-resign-macros --sign-all --username administrator
          if ($LASTEXITCODE -ne 0) { throw "Macro re-signing failed" }
          "## ✓ Macros re-signed" >> $env:GITHUB_STEP_SUMMARY

      # === Testing ===
      - name: Run Unit Tests
        working-directory: "./scripts"
        run: |
          Write-Output "## 🧪 Unit Tests" >> $env:GITHUB_STEP_SUMMARY

          $summary = ./Run-Unit-Tests.ps1 -ProjectPath "../test/Kentico.Community.Portal.Web.Tests/Kentico.Community.Portal.Web.Tests.csproj"
          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Run Integration Tests
        working-directory: "./scripts"
        run: |
          Write-Output "## 🔗 Integration Tests" >> $env:GITHUB_STEP_SUMMARY

          $summary = ./Run-Integration-Tests.ps1 -ProjectPath "../test/Kentico.Community.Portal.Web.Integration.Tests/Kentico.Community.Portal.Web.Integration.Tests.csproj"
          $summary >> $env:GITHUB_STEP_SUMMARY

      - name: Free disk space
        run: |
          Write-Output "Reclaiming disk space before E2E tests..."
          Write-Output "Disk before cleanup:"
          df -h /

          Remove-Item -Path "./database/${{ env.DATABASE_BACKUP_FILENAME }}.zip" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "./database/${{ env.DATABASE_BACKUP_FILENAME }}" -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "./src/Kentico.Community.Portal.Web/node_modules" -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -Path "./src/Kentico.Community.Portal.Admin/Client/node_modules" -Recurse -Force -ErrorAction SilentlyContinue

          Write-Output "Disk after cleanup:"
          df -h /

      # === E2E Testing ===
      - name: Publish web application
        run: |
          Write-Output "Publishing application..."
          dotnet publish `
            ./src/${{ env.PROJECT_NAME }} `
            -c Release `
            -o ./publish `
            --no-build `
            --no-restore
          # Content item asset files live in the project's assets/ folder (git), which publish
          # doesn't fully include. The E2E app runs from ./publish, so without them every image
          # request fails ("Could not find the asset file"). CI only: the deployment package
          # handles assets.
          # Publish already creates ./publish/assets (the default **/*.json content glob picks up
          # JSON asset files), so copy the folder's contents: copying the folder itself into an
          # existing destination nests it as ./publish/assets/assets.
          $sourceAssets = "./src/${{ env.PROJECT_NAME }}/assets"
          New-Item -ItemType Directory -Path ./publish/assets -Force | Out-Null
          Copy-Item -Path "$sourceAssets/*" -Destination ./publish/assets -Recurse -Force
          Write-Output "✓ Application published to ./publish"

      - name: Run E2E tests (portal)
        working-directory: ./test/kentico-community-portal-web-e2e-tests
        env:
          PORTAL_BASE_URL: https://localhost:45039
          PORTAL_MCP_URL: https://localhost:45039/mcp
          PLAYWRIGHT_WEB_SERVER_TIMEOUT_MS: 30000
          NODE_OPTIONS: --no-warnings
        run: |
          Write-Output "## 🎭 E2E Tests" >> $env:GITHUB_STEP_SUMMARY
          pnpm test --project=portal-tests
          "Playwright TypeScript portal E2E suite passed." >> $env:GITHUB_STEP_SUMMARY

      - name: Run E2E tests (admin)
        working-directory: ./test/kentico-community-portal-web-e2e-tests
        env:
          PORTAL_BASE_URL: https://localhost:45039
          PORTAL_MCP_URL: https://localhost:45039/mcp
          ADMIN_BASE_URL: https://localhost:45039/admin
          ADMIN_DEFAULT_USERNAME: administrator
          ADMIN_DEFAULT_PASSWORD: Pass@12345
          PLAYWRIGHT_WEB_SERVER_TIMEOUT_MS: 30000
          NODE_OPTIONS: --no-warnings
        run: |
          Write-Output "## 🎭 Admin E2E Tests" >> $env:GITHUB_STEP_SUMMARY
          pnpm test --project=admin-tests
          "Playwright TypeScript admin E2E suite passed." >> $env:GITHUB_STEP_SUMMARY

      # Specs that change process-wide state (read-only mode, Tag Manager stub, retention tasks).
      # Serial, after the other suites; --no-deps because those already ran above.
      - name: Run E2E tests (isolated)
        working-directory: ./test/kentico-community-portal-web-e2e-tests
        env:
          PORTAL_BASE_URL: https://localhost:45039
          PORTAL_MCP_URL: https://localhost:45039/mcp
          PLAYWRIGHT_WEB_SERVER_TIMEOUT_MS: 30000
          NODE_OPTIONS: --no-warnings
        run: |
          Write-Output "## 🎭 Isolated E2E Tests" >> $env:GITHUB_STEP_SUMMARY
          pnpm test --project=isolated-tests --no-deps
          "Playwright TypeScript isolated E2E suite passed." >> $env:GITHUB_STEP_SUMMARY

      # === Artifacts (on failure) ===
      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-artifacts-${{ github.run_number }}
          path: |
            test/kentico-community-portal-web-e2e-tests/playwright-report
            test/kentico-community-portal-web-e2e-tests/test-results
          # Traces are consumed within minutes of a red run, while the PR is still being worked
          # on - see the diagnose-ci-failure skill. Nothing reads them days later.
          retention-days: 1
          if-no-files-found: ignore
